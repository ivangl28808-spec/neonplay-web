<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0614">
<title>Grieta</title>
<style>
  /* Pantalla única a 320×180 escalada a píxel entero; los controles táctiles flotan encima. Se juega siempre en la misma paleta oscura. */
  :root { --bg: #07040f; --fg: #eef0ff; --muted: #9a8fc0; --accent: #35e3f0; --panel: rgba(20,14,40,.45); --line: rgba(255,255,255,.45); color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #c { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; outline: none; }
  #hint { max-width: 96vw; font-size: 12px; line-height: 1.5; color: var(--muted); text-align: center; padding-inline: 16px; }
  #hint b { color: var(--fg); font-weight: 600; }
  body.touch #hint { display: none; }
  /* en vertical se juega igual: el juego arriba a todo lo ancho, los botones abajo y un aviso pequeño que no tapa nada */
  #rotate { display: none; color: var(--muted); font-size: 13px; text-align: center; padding-inline: 16px; }
  body.portrait { justify-content: flex-start; padding-top: 12px; }
  body.portrait #rotate { display: block; }
  body.portrait #dbg { position: static; transform: none; flex-wrap: wrap; justify-content: center; }
  /* controles táctiles: sólo se ven en pantallas táctiles */
  #ui { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 10; }
  body.touch #ui { display: block; }
  /* joystick fijo (izquierda) y botones en rombo como mando de PS1 (derecha): ✕ salto abajo, □ golpe izquierda, ○ dash derecha, △ disparo arriba */
  #stick { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); width: 128px; height: 128px; border-radius: 50%; pointer-events: auto; touch-action: none; background: var(--panel); border: 2px solid var(--line); }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(238,240,255,.35); border: 2px solid var(--fg); transition: transform .05s; }
  #pad { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 14px); width: 176px; height: 176px; pointer-events: none; }
  .btn { position: absolute; pointer-events: auto; width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; touch-action: none; font: 700 26px/1 system-ui; }
  .btn small { position: absolute; bottom: -15px; font: 700 9px/1 system-ui; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .btn.on { background: rgba(53,227,240,.55); border-color: var(--accent); }
  #b-x { left: 58px; bottom: 0; color: #8fb8ff; }
  #b-sq { left: 0; top: 58px; color: #ff9fd6; }
  #b-ci { right: 0; top: 58px; color: #ff8a8a; }
  #b-tr { left: 58px; top: 0; color: #7fe8b6; }
  body.portrait #pad { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 24px); }
  /* barra de pruebas (habilidades y zona) */
  #dbg { position: fixed; top: 4px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 4px; opacity: .8; }
  #dbg button { font: 700 10px system-ui; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; touch-action: none; }
  #dbg button.off { opacity: .45; text-decoration: line-through; }
  body:not(.touch) #dbg, body:not(.debug) #dbg { display: none; }
</style>
</head>
<body>
<canvas id="c" width="320" height="180" tabindex="0"></canvas>
<div id="hint"><b>Haz clic en el juego</b> para darle foco · <b>← →</b> mover · <b>Z</b> salto · <b>X</b> golpe · <b>C</b> dash · <b>V</b> arma · <b>↑ + X</b> golpe arriba · <b>↓ + X</b> en el aire = rebote · <b>C</b> + <b>X</b> estocada (si la tienes) · <b>Z</b> o <b>X</b> pasan el diálogo</div>
<div id="rotate">Se juega mejor con el teléfono en horizontal.</div>
<div id="dbg">
  <button data-dbg="dash">1 DASH</button><button data-dbg="wallJump">2 PARED</button><button data-dbg="pogo">3 REBOTE</button><button data-dbg="sub">4 ARMA</button><button data-dbg="estocada" class="off">5 ESTOCADA</button><button data-dbg="zone">ZONA</button><button data-dbg="reset">REINICIAR</button>
</div>
<div id="ui">
  <div id="stick"><div id="knob"></div></div>
  <div id="pad">
    <div class="btn" id="b-tr" data-act="sub">△<small>Disparo</small></div>
    <div class="btn" id="b-sq" data-act="attack">□<small>Golpe</small></div>
    <div class="btn" id="b-ci" data-act="dash">○<small>Dash</small></div>
    <div class="btn" id="b-x" data-act="jump">✕<small>Salto</small></div>
  </div>
</div>
<script>
// core.js — simulación del juego (sin dibujo ni entradas del navegador).
// Corre igual en el navegador y en Node, así las dinámicas se prueban con pruebas automáticas.
// Unidades: píxeles del juego (pantalla base 320×180, tile de 16) y cuadros a 60 por segundo.
(function (root) {
  'use strict';

  const T = 16;

  // ---------- ajustes de sensación (todo el "feel" vive aquí para poder afinarlo) ----------
  const C = {
    gravity: 0.32, maxFall: 6.2,
    runMax: 1.55, runAccel: 0.22, runFric: 0.30, airAccel: 0.16, airFric: 0.05,
    jumpV: 5.35, jumpCut: 2.0, coyote: 6, buffer: 6,
    wallSlideMax: 1.1, wallJumpVx: 2.6, wallJumpVy: 5.1, wallLock: 9, wallCoyote: 5,
    wallClimbVx: 1.0, wallClimbLock: 5,          // salto de pared manteniendo hacia la pared: casi no se despega (trepa como en Mega Man X)
    dashSpeed: 3.7, dashFrames: 13, dashCooldown: 16, dashIframes: 9, boostMax: 2.7,
    atkDur: 14, atkStart: 2, atkEnd: 7, atkDmg: 1, atkCd: 4,   // un solo golpe rápido; se puede mover mientras golpea
    pogoV: 4.9, pogoDur: 16, pogoStart: 2, pogoEnd: 13,
    stabDur: 16, stabDash: 12, stabDmg: 2,        // estocada: golpe durante el dash (habilidad que se compra)
    subCost: 2, subSpeed: 4.6, subLife: 70, subCd: 14, subDmg: 2, energyMax: 6,
    hurtStun: 14, invFrames: 70, hurtVx: 2.4, hurtVy: 3.0,
    hitstop: 3,
    // trampas
    spikeCycle: 150, spikeOut: 70,                 // pinchos retráctiles: salen 70 de cada 150 cuadros (con aviso antes)
    laserCycle: 140, laserOn: 60,                  // láser: prendido 60 de cada 140 cuadros
    crumbleT: 26, crumbleBack: 200                 // plataforma que se desmorona: aguanta 26 cuadros pisada y vuelve a los 200
  };

  const PW = 12, PH = 24;   // caja del héroe (más chica que el sprite: agarra mejor)

  // ---------- entradas ----------
  const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'dash', 'attack', 'sub'];
  class Input {
    constructor() { this.held = {}; this.prev = {}; this.pressed = {}; ACTIONS.forEach(a => { this.held[a] = false; this.prev[a] = false; this.pressed[a] = false; }); }
    set(a, v) { this.held[a] = !!v; }
    step() { ACTIONS.forEach(a => { this.pressed[a] = this.held[a] && !this.prev[a]; this.prev[a] = this.held[a]; }); }
    released(a) { return !this.held[a] && this.prev[a]; }
  }

  // ---------- mundo ----------
  // Letras de las salas: # sólido · v enredadera (sólida; se corta con la espada) · ^ pinchos · w caminante · f volador · t torreta
  // P inicio · C punto de guardado · E meta · H habilidad escondida · L fragmento de vida · K Karen · X el creador de la grieta
  // r pinchos retráctiles · = plataforma que se desmorona (_ cuando ya cayó) · z láser que se prende y se apaga
  // 1-9 disparadores de la historia (se activan al pasar por esa columna)
  const SOLID = c => c === '#' || c === 'v' || c === '=';
  // fase de las trampas con tiempo (depende del cuadro y de la columna, así las filas de trampas hacen ola)
  const spikePhase = (frame, tx) => (frame + tx * 6) % C.spikeCycle;
  const spikeOut = (frame, tx) => spikePhase(frame, tx) < C.spikeOut;
  const laserPhase = (frame, tx) => (frame + tx * 23) % C.laserCycle;
  const laserOn = (frame, tx) => laserPhase(frame, tx) < C.laserOn;
  class World {
    constructor(rows) {
      this.rows = rows; this.h = rows.length; this.w = rows[0].length;
      this.grid = rows.map(r => r.split(''));
      this.spawns = []; this.checkpoints = []; this.goal = null; this.start = { x: 2 * T, y: 2 * T };
      this.items = []; this.marks = {}; this.triggers = [];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const c = this.grid[y][x];
        if (c === 'P') { this.start = { x: x * T + (T - PW) / 2, y: (y + 1) * T - PH }; this.grid[y][x] = '.'; }
        else if (c === 'w' || c === 'f' || c === 't') { this.spawns.push({ type: c, x: x * T, y: y * T }); this.grid[y][x] = '.'; }
        else if (c === 'C') { this.checkpoints.push({ x: x * T, y: y * T }); this.grid[y][x] = '.'; }
        else if (c === 'E') { this.goal = { x: x * T, y: y * T }; this.grid[y][x] = '.'; }
        else if (c === 'H' || c === 'L') { this.items.push({ kind: c === 'H' ? 'habilidad' : 'vida', x: x * T, y: y * T, w: T, h: T }); this.grid[y][x] = '.'; }
        else if (c === 'K' || c === 'X') { this.marks[c] = { x: x * T, y: y * T }; this.grid[y][x] = '.'; }
        else if (c >= '1' && c <= '9') { this.triggers.push({ id: c, x: x * T, y: y * T }); this.grid[y][x] = '.'; }
      }
    }
    // arriba del mapa se repite la primera fila: una pared que toca el techo no se puede trepar para salirse por arriba
    tile(tx, ty) { if (tx < 0 || tx >= this.w) return '#'; if (ty < 0) return this.grid[0][tx] === '#' ? '#' : '.'; if (ty >= this.h) return '.'; return this.grid[ty][tx]; }
    solidAt(px, py) { return SOLID(this.tile(Math.floor(px / T), Math.floor(py / T))); }
    // ¿la caja (x,y,w,h) toca un tile sólido?
    boxSolid(x, y, w, h) {
      const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.001) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.001) / T);
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (SOLID(this.tile(tx, ty))) return true;
      return false;
    }
    // trampas que dañan dentro de la caja en este cuadro (lista de {tx,ty,c}); sin frame sólo cuenta los pinchos fijos
    spikesIn(x, y, w, h, frame) {
      const out = [], x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.001) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.001) / T);
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
        const c = this.tile(tx, ty);
        if (c === '^' || (frame !== undefined && ((c === 'r' && spikeOut(frame, tx)) || (c === 'z' && laserOn(frame, tx))))) out.push({ tx, ty, c });
      }
      return out;
    }
  }

  // mueve una caja contra los tiles sólidos, un eje a la vez; devuelve si chocó
  function moveBox(world, b, dx, dy) {
    let hitX = false, hitY = false;
    // eje X
    let steps = Math.ceil(Math.abs(dx) / 4) || 0;
    for (let i = 0; i < steps; i++) {
      const sx = dx / steps;
      if (!world.boxSolid(b.x + sx, b.y, b.w, b.h)) b.x += sx;
      else { hitX = true; if (sx > 0) b.x = Math.floor((b.x + b.w + sx) / T) * T - b.w - 0.001; else b.x = (Math.floor((b.x + sx) / T) + 1) * T; break; }
    }
    // eje Y
    steps = Math.ceil(Math.abs(dy) / 4) || 0;
    for (let i = 0; i < steps; i++) {
      const sy = dy / steps;
      if (!world.boxSolid(b.x, b.y + sy, b.w, b.h)) b.y += sy;
      else { hitY = true; if (sy > 0) b.y = Math.floor((b.y + b.h + sy) / T) * T - b.h - 0.001; else b.y = (Math.floor((b.y + sy) / T) + 1) * T; break; }
    }
    return { hitX, hitY };
  }

  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // ---------- juego ----------
  class Game {
    constructor(rows, opts) {
      opts = opts || {};
      this.world = new World(rows);
      this.input = opts.input || new Input();
      this.externalInput = !!opts.externalInput;
      this.cajas = opts.cajas || {};                     // tamaño de choque de los enemigos según el arte de la sala
      this.abilities = Object.assign({ sword: true, dash: true, wallJump: true, pogo: true, sub: true, estocada: false }, opts.abilities || {});
      this.seed = opts.seed || 1234;
      this.frame = 0; this.hitstop = 0; this.events = [];
      this.coins = 0; this.zone = opts.zone || 0; this.cpIdx = -1;
      this.checkpoint = { x: this.world.start.x, y: this.world.start.y };
      this.reset(true);
    }
    rand() { this.seed = (this.seed * 16807) % 2147483647; return (this.seed - 1) / 2147483646; }
    emit(type, data) { this.events.push(Object.assign({ type, frame: this.frame }, data || {})); }

    reset(first) {
      const w = this.world, cp = this.checkpoint;
      this.p = {
        x: cp.x, y: cp.y, w: PW, h: PH, vx: 0, vy: 0, face: 1,
        onGround: false, wallDir: 0, coyoteT: 0, bufferT: 0, wallCoyoteT: 0, wallCoyoteDir: 0, wallLockT: 0,
        dashT: 0, dashCd: 0, airDashUsed: false, boost: false, dashDir: 1,
        atkT: 0, atkStage: 0, atkKind: 'none', atkHit: new Set(), atkBuffer: 0, atkCd: 0,
        subCd: 0, hurtT: 0, invT: 0, hp: 5, maxHp: 5, energy: 0, dead: false, deadT: 0,
        jumpHeld: false, lastGroundY: cp.y, slideDust: 0
      };
      this.enemies = w.spawns.map((s, i) => this.makeEnemy(s.type, s.x, s.y, i));
      this.shots = []; this.bullets = []; this.pickups = []; this.fx = [];
      // al reaparecer vuelven todas las plataformas que se habían caído
      for (const k in this.crumbles || {}) { const c = this.crumbles[k]; this.world.grid[c.ty][c.tx] = '='; }
      this.crumbles = {};
      this.won = false;
      if (!first) this.emit('respawn');
    }

    makeEnemy(type, x, y, id) {
      const cj = this.cajas;
      if (type === 'w') { const [w, h] = cj.walker || [14, 14]; return { id, type: 'walker', x: x + (T - w) / 2, y: y + T - h, w, h, vx: -0.5, vy: 0, dir: -1, hp: 3, flash: 0, hurtT: 0, coins: 3 }; }
      if (type === 'f') { const [w, h] = cj.flyer || [12, 10]; return { id, type: 'flyer', x: x + (T - w) / 2, y: y + 3, w, h, vx: 0, vy: 0, baseY: y + 3, t: id * 17, hp: 2, flash: 0, hurtT: 0, coins: 2, dir: 1 }; }
      return { id, type: 'turret', x, y, w: 16, h: 16, vx: 0, vy: 0, hp: 4, flash: 0, hurtT: 0, coins: 5, cd: 60 + id * 13, dir: -1 };
    }

    // ---------- paso de simulación ----------
    step() {
      this.events.length = 0;
      if (!this.externalInput) this.input.step();   // con director, él avanza las entradas (también durante los diálogos)
      if (this.hitstop > 0) { this.hitstop--; this.frame++; return; }
      this.frame++;
      const p = this.p;
      if (p.dead) { p.deadT++; if (p.deadT > 50) this.reset(false); this.updateFx(); return; }
      this.updatePlayer();
      this.updateEnemies();
      this.updateShots();
      this.updatePickups();
      this.updateCrumbles();
      this.updateFx();
      this.checkGoal();
    }

    updatePlayer() {
      const p = this.p, w = this.world, inp = this.input, A = this.abilities;
      const L = inp.held.left, R = inp.held.right, dirIn = (R ? 1 : 0) - (L ? 1 : 0);

      // temporizadores
      if (p.dashCd > 0) p.dashCd--;
      if (p.hurtT > 0) p.hurtT--;
      if (p.invT > 0) p.invT--;
      if (p.subCd > 0) p.subCd--;
      if (p.wallLockT > 0) p.wallLockT--;
      if (p.wallCoyoteT > 0) p.wallCoyoteT--;
      if (p.coyoteT > 0) p.coyoteT--;
      if (p.bufferT > 0) p.bufferT--;
      if (inp.pressed.jump) p.bufferT = C.buffer;

      const stunned = p.hurtT > 0;

      // ---------- dash ----------
      if (!stunned && A.dash && inp.pressed.dash && p.dashCd === 0 && p.dashT === 0 && (p.onGround || !p.airDashUsed)) {
        p.dashT = C.dashFrames; p.dashDir = dirIn || p.face; p.face = p.dashDir;
        if (!p.onGround) p.airDashUsed = true;
        p.atkT = 0; p.atkKind = 'none';
        this.emit('dash');
      }
      if (p.dashT > 0) {
        p.dashT--; p.vx = p.dashDir * C.dashSpeed; p.vy = 0;
        if (p.dashT === 0) { p.dashCd = C.dashCooldown; p.vx = p.dashDir * (p.boost ? C.dashSpeed * 0.7 : C.runMax); }
      }

      // ---------- movimiento horizontal ----------
      if (p.dashT === 0 && !stunned) {
        const lock = p.wallLockT > 0;
        const maxV = p.boost ? C.runMax * 1.9 : C.runMax;
        if (dirIn !== 0 && !lock) {
          const acc = p.onGround ? C.runAccel : C.airAccel;
          const old = p.vx;
          let nv = old + dirIn * acc;
          if (Math.abs(nv) > maxV) {
            // por encima del máximo (impulso del dash) sólo se va frenando; si no, se topa en el máximo
            nv = (Math.abs(old) > maxV && Math.sign(old) === dirIn) ? old - dirIn * (p.onGround ? 0.15 : 0.03) : dirIn * maxV;
          }
          p.vx = nv;
          if (p.atkT === 0) p.face = dirIn;
        } else if (!lock) {
          const fr = p.onGround ? C.runFric : C.airFric;
          if (Math.abs(p.vx) <= fr) p.vx = 0; else p.vx -= Math.sign(p.vx) * fr;
        }
      }

      // ---------- salto / salto de pared ----------
      if (!stunned && p.bufferT > 0) {
        if (p.onGround || p.coyoteT > 0) {
          p.vy = -C.jumpV; p.onGround = false; p.coyoteT = 0; p.bufferT = 0; p.jumpHeld = true;
          if (p.dashT > 0) { p.boost = true; p.dashT = 0; p.dashCd = C.dashCooldown; p.vx = p.dashDir * C.dashSpeed; }
          this.emit('jump');
        } else if (A.wallJump && (p.wallDir !== 0 || p.wallCoyoteT > 0)) {
          const d = p.wallDir !== 0 ? p.wallDir : p.wallCoyoteDir;
          const climb = dirIn === d;                  // mantiene hacia la pared: trepa la misma pared
          p.vx = -d * (climb ? C.wallClimbVx : C.wallJumpVx); p.vy = -C.wallJumpVy; p.face = climb ? d : -d;
          p.wallLockT = climb ? C.wallClimbLock : C.wallLock;
          p.bufferT = 0; p.wallCoyoteT = 0; p.jumpHeld = true; p.dashT = 0; p.boost = false;
          this.emit('walljump');
        }
      }
      // salto de altura variable
      if (p.jumpHeld && !inp.held.jump) { if (p.vy < -C.jumpCut) p.vy = -C.jumpCut; p.jumpHeld = false; }
      if (p.vy >= 0) p.jumpHeld = false;

      // ---------- gravedad y deslizarse por la pared ----------
      if (p.dashT === 0) {
        p.vy += C.gravity;
        if (p.vy > C.maxFall) p.vy = C.maxFall;
        const towardWall = (p.wallDir === 1 && R) || (p.wallDir === -1 && L);
        if (A.wallJump && p.wallDir !== 0 && !p.onGround && p.vy > 0 && towardWall) { p.vy = Math.min(p.vy, C.wallSlideMax); p.sliding = true; }
        else p.sliding = false;
      }

      // ---------- ataques ----------
      this.updateAttack(dirIn, stunned);

      // ---------- sub-arma ----------
      if (!stunned && A.sub && inp.pressed.sub && p.subCd === 0 && p.energy >= C.subCost && p.dashT === 0) {
        p.energy -= C.subCost; p.subCd = C.subCd;
        this.shots.push({ x: p.x + (p.face > 0 ? p.w : -6), y: p.y + 9, w: 6, h: 4, vx: C.subSpeed * p.face, life: C.subLife, dmg: C.subDmg });
        this.emit('sub');
      }

      // ---------- integrar con los tiles ----------
      const wasGround = p.onGround;
      const res = moveBox(w, p, p.vx, 0);
      if (res.hitX) { if (p.dashT > 0) p.dashT = 1; p.vx = 0; p.boost = false; }
      const res2 = moveBox(w, p, 0, p.vy);
      p.onGround = false;
      if (res2.hitY) { if (p.vy > 0) { p.onGround = true; } p.vy = p.vy > 0 ? 0 : 0.2; }
      // ¿piso justo abajo?
      if (!p.onGround && p.vy >= 0 && w.boxSolid(p.x, p.y + 1, p.w, p.h)) p.onGround = true;
      if (p.onGround) {
        p.coyoteT = C.coyote; p.airDashUsed = false; p.boost = p.boost && p.dashT > 0;
        if (!wasGround) this.emit('land');
      } else if (wasGround && p.vy >= 0) p.coyoteT = C.coyote;

      // pared: ¿toco una pared a la izquierda o derecha?
      let wd = 0;

<script>
// salas.js — las salas de la historia. Cada una trae su mapa (letras de core.js), su arte, las habilidades con las que
// se entra y lo que dicen los personajes (los guiones los corre historia.js).
//
//   prologo  Ciudad corrupta: persecución por los techos con todas las habilidades; al final se abre la grieta.
//   bosque1  Bosque: el héroe despierta sin nada. Karen lo encuentra; la espada está escondida en la cueva de abajo
//            y hace falta para cortar las enredaderas de la salida. Arriba queda un fragmento de vida que sólo se alcanza
//            al volver con el salto de pared (así se enseña a regresar).
//   prueba   La sala de prueba de las dinámicas (level.js), con todo desbloqueado.
(function (root) {
  'use strict';
  const G = root.Grieta;

  function grid(W, H) {
    const g = Array.from({ length: H }, () => Array(W).fill('.'));
    const fill = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g[y][x] = c; };
    const set = (x, y, c) => { g[y][x] = c; };
    return { g, fill, set, rows: () => g.map(r => r.join('')) };
  }

  // ---------- prólogo: techos de la Ciudad corrupta (largo, con todas las habilidades) ----------
  function prologo() {
    const W = 200, H = 16, { fill, set, rows } = grid(W, H);
    const edif = (x0, x1, techo) => fill(x0, techo, x1, H - 1, '#');
    fill(0, 0, 0, H - 1, '#'); fill(W - 1, 0, W - 1, H - 1, '#');
    edif(1, 24, 11); set(3, 10, 'P'); set(18, 7, 'f');                       // A: arranque
    // foso corto 25-26
    edif(27, 44, 11); set(31, 10, '5'); fill(36, 6, 36, 10, 'z'); set(40, 7, 'f'); set(42, 10, '2');   // B: láser
    // foso ancho 45-49: dash
    edif(50, 60, 12); set(55, 11, '3'); set(58, 11, 't');                   // C: torreta
    edif(61, 72, 4); fill(66, 3, 67, 3, '^');                                // D: pared alta y pinchos arriba
    edif(73, 80, 9); set(75, 8, 'C'); set(79, 8, '6');                       // E: primer punto de guardado
    fill(81, 9, 88, 9, '='); set(85, 5, 'f');                                // puente que se desmorona sobre el vacío
    edif(89, 100, 9); fill(93, 4, 93, 8, 'z'); fill(97, 4, 97, 8, 'z');      // F: dos láseres
    // foso 101-104
    edif(105, 118, 12); set(110, 8, 'f'); set(116, 11, 't');                // G
    edif(119, 126, 5); fill(121, 4, 122, 4, '^');                            // H: otra pared alta
    fill(128, 8, 129, 8, '='); fill(132, 7, 133, 7, '='); fill(136, 8, 137, 8, '=');   // I: piedras que se caen
    edif(140, 160, 10); set(143, 9, 'C'); fill(148, 5, 148, 9, 'z'); fill(152, 5, 152, 9, 'z'); set(155, 6, 'f'); set(159, 9, 't');   // J
    // foso 161-165: dash
    edif(166, W - 2, 10); set(172, 9, 't'); set(176, 5, 'f'); set(182, 6, 'f'); set(186, 9, '4'); set(192, 9, 'X');   // K: el final
    return rows();
  }

  // ---------- bosque, primer tramo (largo; sin habilidades hasta la espada) ----------
  function bosque1() {
    const W = 230, H = 24, { fill, set, rows } = grid(W, H);
    fill(0, 15, W - 1, H - 1, '#');
    fill(0, 0, 0, H - 1, '#'); fill(W - 1, 0, W - 1, H - 1, '#');
    const foso = (x0, x1) => fill(x0, 15, x1, H - 1, '.');                  // sin fondo: caer es volver al punto de guardado
    const pinchos = (x0, x1) => fill(x0, 15, x1, 15, '^');                  // parche de pinchos a ras del suelo
    // superficie
    set(3, 14, 'P'); set(12, 14, 'w');
    foso(16, 17);
    fill(23, 14, 25, 14, 'r');
    fill(30, 13, 31, 14, '#'); set(34, 14, 'w');
    pinchos(38, 40);
    // arriba: fragmento de vida sobre una repisa colgada; sin salto de pared no se sube
    fill(46, 8, 54, 8, '#'); fill(54, 9, 54, 12, '#'); set(50, 7, 'L'); set(47, 14, '2');
    foso(58, 64); fill(58, 15, 64, 15, '=');                                 // puente que se desmorona
    set(68, 14, 'C'); set(71, 11, 'f');
    // cueva de abajo (la superficie queda de un tile de grueso)
    fill(74, 16, 132, 20, '.');
    fill(76, 15, 77, 15, '.');                                               // hueco de entrada
    set(85, 14, 'w'); fill(92, 14, 93, 14, 'r'); set(100, 14, 'w'); set(110, 10, 'f');   // encima de la cueva
    set(84, 20, 'w'); fill(90, 20, 91, 20, 'r');
    fill(98, 21, 102, 22, '.'); fill(98, 22, 102, 22, '^'); fill(98, 21, 102, 21, '=');   // puente sobre pinchos
    set(108, 20, 'w'); fill(112, 19, 113, 20, '#');
    set(118, 20, 'H');                                                       // la espada
    // salida: escalera de un tile por escalón (con escalones de dos el héroe choca la cabeza con el techo)
    fill(122, 20, 122, 20, '#'); fill(123, 19, 123, 20, '#'); fill(124, 18, 124, 20, '#'); fill(125, 17, 125, 20, '#'); fill(126, 16, 128, 20, '#');
    fill(124, 15, 128, 15, '.');
    // Karen y las enredaderas
    set(132, 14, '3'); set(134, 14, 'C'); set(136, 14, 'K');
    fill(140, 8, 140, 14, 'v');
    // con espada
    set(145, 14, 'w'); set(149, 14, 'w');
    foso(152, 154); set(153, 10, 'f');
    fill(157, 14, 160, 14, 'r');
    foso(163, 175); fill(165, 13, 166, 13, '='); fill(169, 12, 170, 12, '='); fill(173, 13, 174, 13, '=');
    set(178, 14, 'C');
    pinchos(182, 184); set(187, 14, 'w'); set(190, 10, 'f');
    fill(194, 14, 196, 14, 'r');
    foso(199, 200); set(204, 14, 'w'); set(208, 9, 'f');
    fill(212, 13, 213, 14, '#'); set(217, 14, 'w');
    set(224, 14, 'E');
    return rows();
  }

  const NADA = { sword: false, dash: false, wallJump: false, pogo: false, sub: false };
  const TODO = { sword: true, dash: true, wallJump: true, pogo: true, sub: true };   // la estocada no: se compra en la tienda

  // Guiones: listas de pasos. Una función recibe al director y devuelve la lista (así puede decidir según lo que ya pasó).
  //   say: diálogo · wait: cuadros · fade: fundido · grieta: se abre la grieta · give: habilidad · banner: letrero grande
  //   pose: pose del héroe · karen: mostrar u ocultar a Karen · flag: marca · room: cambiar de sala · shake: sacudida
  const SALAS = {
    prologo: {
      nombre: 'CIUDAD CORRUPTA', arte: 'ciudad', zona: 0, rows: prologo(), abilities: TODO, karen: false, creador: true, cajas: { flyer: [28, 24] },
      guion: {
        inicio: [
          { fade: 0, f: 50 },
          { banner: 'CIUDAD CORRUPTA', sub: 'DISTRITO 9 - MEDIANOCHE', f: 110 },
          { say: 'KAREN (RADIO)', text: 'Logan, te escucho. El creador de la grieta va por los techos, justo delante de ti.' },
          { say: 'KAREN (RADIO)', text: 'Es nuestra oportunidad. Atrápalo antes de que desaparezca otra vez.' },
          { say: 'KAREN (RADIO)', text: d => 'Salta con ' + d.k('jump') + '. Golpea con ' + d.k('attack') + '.' }
        ],
        2: [{ say: 'KAREN (RADIO)', text: d => 'Ese hueco es muy ancho. Salta y usa el dash en el aire: ' + d.k('dash') + '.' }],
        3: [{ say: 'KAREN (RADIO)', text: 'Pared alta. Salta contra ella y sigue saltando sin soltar la dirección: así trepas.' }],

        6: [{ say: 'KAREN (RADIO)', text: 'Ese puente está podrido. No te detengas encima.' }],
        4: [
          { pose: 'reposo' },
          { say: '???', text: 'Llegaste lejos, Logan. Más lejos que en los otros mundos.' },
          { say: 'LOGAN', text: '¿Otros mundos? ¿De qué hablas?' },
          { say: 'LOGAN', text: 'Da igual. Se acabó: vienes conmigo.' },
          { say: '???', text: '¿Contigo? No... Tú vienes conmigo.' },
          { grieta: true, f: 70 }, { shake: 8 },
          { say: 'KAREN (RADIO)', text: '¡¿Qué es eso?! ¡Sal de ahí, ya!' },
          { grieta: 'tragar', f: 50 },
          { fade: 1, color: '#ffffff', f: 40 }, { wait: 30 },
          { room: 'bosque1' }
        ]
      }
    },
    bosque1: {
      nombre: 'BOSQUE', arte: 'bosque', zona: 1, rows: bosque1(), abilities: NADA, karen: 'visto', creador: false, cueva: 16, cajas: { walker: [26, 14], flyer: [20, 20] },
      props: [['tree', 9, 15], ['rock', 20, 15], ['mushroom-red', 28, 15], ['plant', 35, 15], ['tree', 44, 15], ['mushroom-brown', 70, 15],
        ['rock', 82, 15], ['plant', 97, 15], ['tree', 106, 15], ['mushroom-red', 115, 15], ['tree', 146, 15], ['rock', 150, 15],
        ['plant', 180, 15], ['tree', 191, 15], ['mushroom-brown', 205, 15], ['tree', 216, 15], ['plant', 222, 15]],
      guion: {
        inicio: [
          { fade: 1, color: '#ffffff' }, { pose: 'agachar' }, { fade: 0, f: 70, color: '#ffffff' }, { wait: 40 },
          { say: 'LOGAN', text: '¿Dónde... estoy?' },
          { pose: null },
          { say: 'KAREN (RADIO)', text: '...Logan... ¿me escuchas? ...la señal... está muy débil...' },
          { say: 'LOGAN', text: 'Karen. Perdí el equipo al cruzar esa cosa. No tengo ni la espada.' },
          { say: 'KAREN (RADIO)', text: '...busca... la grieta te... *estática*' },
          { banner: 'BOSQUE', sub: 'DONDE TE ESCUPIÓ LA GRIETA', f: 110 }
        ],
        2: [{ say: 'LOGAN', text: 'Algo brilla allá arriba. No alcanzo... todavía.' }],
        3: d => d.save.abilities.sword ? [
          { karen: true },
          { say: 'KAREN', text: '¡Logan! Yo también caí por la grieta cuando se abrió.' },
          { say: 'LOGAN', text: 'Dijo que llegué más lejos que en los otros mundos. Como si ya me conociera.' },
          { say: 'KAREN', text: 'Luego lo pensamos. Primero salgamos de aquí.' },
          { say: 'KAREN', text: d2 => '¿Y esa espada? Perfecto. Corta esas enredaderas con ' + d2.k('attack') + '.' }
        ] : [
          { karen: true },
          { say: 'KAREN', text: '¡Logan! Yo también caí por la grieta cuando se abrió.' },

// historia.js — el director: carga salas, corre los guiones (diálogos y cinemáticas) y guarda lo que el héroe ya consiguió.
// No dibuja ni lee el navegador: corre igual en Node, así la historia también se prueba con pruebas automáticas.

(function (root) {
  'use strict';
  const G = root.Grieta;
  const { T, Input, Game } = G;

  const TECLAS = { jump: 'Z', attack: 'X', dash: 'C', sub: 'V' };
  const BOTONES = { jump: 'el botón SALTO', attack: 'el botón GOLPE', dash: 'el botón DASH', sub: 'el botón DISPARO' };

  class Director {
    constructor(opts) {

    busy() { return !!(this.dialog || this.queue.length || this.waitT > 0); }

    // un cuadro de juego (60 por segundo)
    step() {

      // monedas
      for (const c of g.pickups) { ctx.fillStyle = (this.tick + c.age) % 16 < 8 ? '#ffc83d' : '#fff2b0'; ctx.fillRect(Math.round(c.x), Math.round(c.y), 4, 4); }
      // enemigos

      for (const e of g.enemies) {
        if (e.hp <= 0) continue;
        if (A && this.drawEnemyArt(ctx, A, e)) continue;
        const gl = corrupt && (this.tick + e.id * 7) % 40 < 3 ? ((this.tick % 3) - 1) * 2 : 0;
        const ex = Math.round(e.x) + gl, ey = Math.round(e.y);
        const col = e.flash > 0 ? '#ffffff' : (e.type === 'walker' ? '#d63a6a' : e.type === 'flyer' ? '#8b5cf6' : '#7a8aa8');
        ctx.fillStyle = col; ctx.fillRect(ex, ey, e.w, e.h);
        ctx.fillStyle = '#1a0a1a'; if (e.type === 'walker') { ctx.fillRect(ex + (e.dir > 0 ? 9 : 2), ey + 4, 3, 3); ctx.fillRect(ex, ey + e.h - 3, e.w, 3); }
        if (e.type === 'flyer') { ctx.fillStyle = '#c8b0ff'; const f = Math.sin(this.tick / 2) * 3; ctx.fillRect(ex - 5, ey + 2 + f, 5, 2); ctx.fillRect(ex + e.w, ey + 2 - f, 5, 2); ctx.fillStyle = '#1a0a1a'; ctx.fillRect(ex + 4, ey + 4, 4, 3); }
        if (e.type === 'turret') { ctx.fillStyle = '#3a4560'; ctx.fillRect(ex + (e.dir > 0 ? 8 : -4), ey + 5, 12, 5); ctx.fillStyle = '#ff5a5a'; ctx.fillRect(ex + 6, ey + 6, 4, 4); }
        if (corrupt) { ctx.fillStyle = Z.accent + 'aa'; ctx.fillRect(ex, ey + ((this.tick >> 1) % e.h), e.w, 1); }
      }
      // balas y sub-arma
      for (const s of g.shots) if (this.spriteReady()) { this.drawFrame(ctx, 'proyectil', 0, s.x + s.w / 2, s.y + s.h + 1, s.vx < 0); } else { ctx.fillStyle = '#7ff'; ctx.fillRect(Math.round(s.x), Math.round(s.y), s.w, s.h); ctx.fillStyle = '#7ff8'; ctx.fillRect(Math.round(s.x - s.vx * 3), Math.round(s.y + 1), s.w, 2); }

      if (!this.spriteReady()) for (const t of this.trail) { ctx.fillStyle = 'rgba(255,138,61,' + (t.life / 16) + ')'; ctx.fillRect(Math.round(t.x), Math.round(t.y), PW, PH); }

    // contorno claro de 1 píxel alrededor del héroe: se lee sobre cualquier paleta de zona (su ropa es casi negra)
    outline() {
      const im = this.hImg, w = im.naturalWidth, h = im.naturalHeight;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const c = cv.getContext('2d');
      const sil = document.createElement('canvas'); sil.width = w; sil.height = h;

    spriteReady() { return !!(this.hs && this.hImg && this.hImg.complete && this.hImg.naturalWidth); }

      ctx.save(); ctx.translate(Math.round(x), Math.round(y)); if (flip) ctx.scale(-1, 1);
      ctx.drawImage(this.hAtlas || this.hImg, f * a.w, a.y, a.w, a.h, -a.ax, -a.ay, a.w, a.h);

    // qué animación corresponde al estado de la simulación
    heroAnim(p) {

      if (this.d.pose) return [this.d.pose, this.d.pose === 'reposo' ? Math.floor(this.tick / 12) % 4 : 0];
      if (p.dead) return ['muerte', Math.floor(this.deadT++ / 6)];
      if (p.hurtT > 0) return ['herido', p.hurtT > C.hurtStun / 2 ? 0 : 1];
      if (p.atkT > 0 && p.atkKind === 'pogo') { const t = C.pogoDur - p.atkT; return ['pogo', Math.floor(t / C.pogoDur * 3)]; }
      // un solo golpe: pose corta (espada extendida) de frente o hacia arriba, sin ciclo largo
      if (p.atkT > 0 && p.atkKind === 'sword') return ['espada1', (C.atkDur - p.atkT) < 5 ? 2 : 3];
      if (p.atkT > 0 && p.atkKind === 'up') return ['espada3', (C.atkDur - p.atkT) < 5 ? 1 : 2];
      if (p.atkT > 0 && p.atkKind === 'estocada') return ['espada1', 3];   // brazo extendido mientras se desliza
      if (p.dashT > 0) { const t = C.dashFrames - p.dashT; return ['dash', t < 2 ? 0 : p.dashT <= 2 ? 3 : 1 + ((t >> 2) & 1)]; }

      if (this.landT > 0) return ['agachar', 0];

    }
    // estela del golpe: media luna de píxeles, como un corte rápido
    drawSlash(ctx, p) {
      if (p.atkT > 0 && p.atkKind === 'estocada') return this.drawStab(ctx, p);
      if (p.atkT <= 0 || (p.atkKind !== 'sword' && p.atkKind !== 'up')) return;
      const C = root.Grieta.C, t = C.atkDur - p.atkT;
      if (t > 8) return;

      const up = p.atkKind === 'up', R = up ? 20 : 22;

        const r1 = R * (0.55 + 0.1 * Math.sin(u * Math.PI)), r2 = R;

    }
    // estocada: una raya recta y larga hacia adelante, con punta blanca
    drawStab(ctx, p) {
      const C = root.Grieta.C, t = C.stabDur - p.atkT, Z = this.zone();
      const len = Math.min(36, 10 + t * 6), y = Math.round(p.y + 12), x0 = p.face > 0 ? p.x + p.w : p.x - len;
      ctx.globalAlpha = t > C.stabDur - 5 ? (C.stabDur - t) / 5 : 1;
      ctx.fillStyle = Z.accent; ctx.fillRect(Math.round(x0), y - 1, Math.round(len), 3);

    drawSprite(ctx, p, g) {

      ctx.globalAlpha = 1;
      this.drawFrame(ctx, name, fr, x, y, flip);
      this.drawSlash(ctx, p);
    }

    drawHero(ctx, p, g) {
      const x = Math.round(p.x), y = Math.round(p.y), f = p.face;
      if (p.invT > 0 && (this.tick >> 2) % 2 === 0) return;    // parpadeo al ser herido

      ctx.fillStyle = '#2a140a'; ctx.fillRect(x - 1, y - 1, PW + 2, PH + 2);

      ctx.fillStyle = '#1a0a1a'; ctx.fillRect(x + (f > 0 ? 9 : 2), y + 6, 2, 2);     // ojo

        const act = p.atkKind === 'pogo' ? (t >= 2 && t <= 13) : (t >= 2 && t <= 7);
        ctx.fillStyle = act ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.25)';
        if (p.atkKind === 'pogo') { ctx.fillRect(box.x + 2, box.y + 2, box.w - 4, 3); ctx.fillRect(box.x + box.w / 2 - 1, box.y, 2, box.h - 2); }
        else { ctx.fillRect(Math.round(box.x), Math.round(box.y + box.h / 2 - 2), Math.round(box.w), 4); if (act) { ctx.fillStyle = 'rgba(53,227,240,0.6)'; ctx.fillRect(Math.round(box.x), Math.round(box.y), Math.round(box.w), Math.round(box.h)); } }
      }
    }

    drawHud(ctx, W, H, Z) {
      const g = this.g, p = g.p;
      // corazones
      for (let i = 0; i < p.maxHp; i++) { const on = i < p.hp; ctx.fillStyle = on ? '#ff3d6a' : '#3a2a44'; ctx.fillRect(6 + i * 9, 6, 7, 6); ctx.fillRect(7 + i * 9, 5, 2, 1); ctx.fillRect(10 + i * 9, 5, 2, 1); ctx.fillStyle = on ? '#ff9ab0' : '#3a2a44'; ctx.fillRect(7 + i * 9, 7, 1, 1); }
      // energía
      if (g.abilities.sub) for (let i = 0; i < 6; i++) { ctx.fillStyle = i < p.energy ? '#35e3f0' : '#1a2a44'; ctx.fillRect(6 + i * 6, 15, 5, 3); }
      // monedas
      const s = String(g.coins), wd = textW(s);
      ctx.fillStyle = '#ffc83d'; ctx.fillRect(W - 12 - wd, 6, 5, 5); text(ctx, s, W - 4 - wd, 6, '#fff');
      // habilidades y zona (banco de pruebas)

      if (p.dead) { const m = 'CAISTE'; text(ctx, m, (W - textW(m)) / 2, H / 2 - 3, '#ff8a8a'); }
      if (!this.d.room.debug) return;
      const A = g.abilities; let x = 6; const y = H - 9;
      [['1', 'DASH', A.dash], ['2', 'PARED', A.wallJump], ['3', 'REBOTE', A.pogo], ['4', 'ARMA', A.sub], ['5', 'ESTOCADA', A.estocada]].forEach(([k, n, on]) => {

    // ---------- salas con arte ----------
    drawArtBack(ctx, A, cx, cy, W, H) {

        band(this.img(A.medio), 0.3, -60 * k);

    }
    drawProps(ctx, A) {
      for (const [n, tx, ty] of this.d.room.props || []) { const im = this.img(A.props[n]); if (im) ctx.drawImage(im, Math.round(tx * T + 8 - im.naturalWidth / 2), ty * T - im.naturalHeight + 2); }
    }
    drawTile(ctx, A, w, tx, ty) {
      const S = TILES[this.d.room.arte], im = this.img(A.tiles); if (!im) return;
      const sol = (x, y) => y >= w.h ? true : root.Grieta.SOLID(w.tile(x, y));
      const top = !sol(tx, ty - 1), bot = !sol(tx, ty + 1), l = !sol(tx - 1, ty), r = !sol(tx + 1, ty);
      const pick = a => Array.isArray(a[0]) ? a[(tx * 7 + ty * 13) % a.length] : a;

    }
    // fondo de cueva: las celdas vacías bajo la superficie se ven como tierra oscura y no como cielo
    drawCaveBack(ctx, A, x0, x1, y0, y1) {
      const R = this.d.room, w = this.g.world; if (!R.cueva) return;
      const im = this.img(A.tiles);
      for (let ty = Math.max(y0, R.cueva); ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
        if (root.Grieta.SOLID(w.grid[ty][tx])) continue;
        // ¿hay tierra encima (cueva) o es un foso abierto al cielo?
        let tapado = false; for (let yy = R.cueva - 1; yy < ty; yy++) if (w.grid[yy][tx] === '#') { tapado = true; break; }
        if (!tapado) { ctx.fillStyle = 'rgba(8,4,0,' + Math.min(0.92, 0.25 + (ty - R.cueva) * 0.16) + ')'; ctx.fillRect(tx * T, ty * T, T, T); continue; }
        ctx.fillStyle = '#2b1b0e'; ctx.fillRect(tx * T, ty * T, T, T);
        if (im && (tx * 5 + ty * 3) % 4 === 0) { ctx.globalAlpha = 0.35; ctx.drawImage(im, 8 * T, 5 * T, T, T, tx * T, ty * T, T, T); ctx.globalAlpha = 1; }
      }
    }
    // pinchos (del pack Spikes): los retráctiles avisan saliendo de a poco antes de dañar
    drawSpike(ctx, tx, ty, c) {
      const S = root.Grieta.ARTE && root.Grieta.ARTE.trampas, im = S && this.img(S.pinchos.src);
      let f = 0;
      if (c === 'r') {
        const C = root.Grieta.C, ph = root.Grieta.spikePhase(this.g.frame, tx);
        if (ph < C.spikeOut) f = 0;                                       // afuera: dañan
        else if (ph < C.spikeOut + 24) f = 2 + 2 * Math.floor((ph - C.spikeOut) / 8);   // se esconden
        else if (ph > C.spikeCycle - 24) f = 6 - 2 * Math.floor((ph - (C.spikeCycle - 24)) / 8);   // aviso: asoman

      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(tx * T, ty * T + T - 2, T, 2);   // ranura en el suelo
    }
    // láser: emisores arriba y abajo; parpadea antes de prenderse
    drawLaser(ctx, w, tx, ty) {
      const C = root.Grieta.C, ph = root.Grieta.laserPhase(this.g.frame, tx), x = tx * T + 7, y = ty * T;
      const top = w.tile(tx, ty - 1) !== 'z', bot = w.tile(tx, ty + 1) !== 'z';
      if (ph < C.laserOn) {
        ctx.fillStyle = 'rgba(255,61,154,0.35)'; ctx.fillRect(x - 3, y, 8, T);
        ctx.fillStyle = '#ff3d9a'; ctx.fillRect(x - 1, y, 4, T);
        ctx.fillStyle = (this.tick & 2) ? '#ffffff' : '#ffd0ea'; ctx.fillRect(x, y, 2, T);
      } else if (ph > C.laserCycle - 24 && (this.tick & 4)) { ctx.fillStyle = '#ff3d9a'; ctx.fillRect(x, y, 2, T); }
      else { ctx.fillStyle = 'rgba(255,61,154,0.25)'; for (let yy = 0; yy < T; yy += 4) ctx.fillRect(x, y + yy, 2, 1); }
      ctx.fillStyle = '#2a3048';
      if (top) { ctx.fillRect(x - 4, y, 10, 4); ctx.fillStyle = '#ff3d9a'; ctx.fillRect(x - 1, y + 3, 4, 1); }
      ctx.fillStyle = '#2a3048';
      if (bot) { ctx.fillRect(x - 4, y + T - 4, 10, 4); ctx.fillStyle = '#ff3d9a'; ctx.fillRect(x - 1, y + T - 4, 4, 1); }
    }
    // plataforma que se desmorona: tiembla cuando la pisan
    drawCrumble(ctx, A, tx, ty) {
      const cr = this.g.crumbles && this.g.crumbles[tx + ',' + ty], dx = cr ? ((this.tick >> 1) & 1 ? 1 : -1) : 0;
      const im = A && this.img(A.tiles), x = tx * T + dx, y = ty * T;
      if (im && this.d.room.arte === 'bosque') ctx.drawImage(im, (4 + (tx & 1)) * T, 0, T, T, x, y, T, T);
      else if (im) ctx.drawImage(im, 7 * T, 11 * T, T, T, x, y, T, T);
      else { ctx.fillStyle = '#8a6a4a'; ctx.fillRect(x, y, T, 6); }
      ctx.fillStyle = 'rgba(20,10,0,0.55)'; ctx.fillRect(x + 4 + (tx * 5) % 6, y + 1, 1, 4); ctx.fillRect(x + 10 - (tx * 3) % 5, y + 2, 1, 3);   // grietas
    }
    drawVine(ctx, tx, ty) {
      const x = tx * T, y = ty * T;
      for (let i = 0; i < 4; i++) {
        const bx = x + 1 + i * 4;
        for (let yy = 0; yy < T; yy++) {
          const o = Math.round(Math.sin((ty * T + yy) / 3 + i * 1.7));
          ctx.fillStyle = '#2f4a18'; ctx.fillRect(bx + o, y + yy, 2, 1);
          if ((yy + i * 5 + ty * 3) % 7 === 0) { ctx.fillStyle = '#8fbf3a'; ctx.fillRect(bx + o - 1, y + yy, 3, 2); }
          if ((yy + i * 3) % 11 === 0) { ctx.fillStyle = '#d8e8a0'; ctx.fillRect(bx + o + 2, y + yy, 1, 1); }
        }
      }
    }
    drawEnemyArt(ctx, A, e) {
      const S = e.type === 'walker' ? A.caminante : e.type === 'flyer' ? A.volador : A.torreta;

<script>
// main.js — bucle a 60 cuadros fijos, escalado a píxel entero y entradas (teclado, control, táctil).
// El juego sólo lee ACCIONES (izquierda, derecha, abajo, salto, golpe, dash, arma): así los controles
// se pueden rediseñar después sin tocar el juego.
(function () {
  'use strict';
  const { Director, Renderer, ZONES, SALAS } = window.Grieta;
  const canvas = document.getElementById('c');
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  // ?sala=prueba abre la sala de prueba de las dinámicas; ?sala=bosque1 salta el prólogo
  const pedida = new URLSearchParams(location.search).get('sala');
  const dir = new Director({ sala: SALAS[pedida] ? pedida : 'prologo', touch: isTouch });
  const rend = new Renderer(canvas, dir);
  window.__dir = dir; window.__rend = rend;              // para las pruebas en navegador
  if (dir.room.debug) document.body.classList.add('debug');

  // ---------- escalado ----------
  function fit() {
    const hint = document.getElementById('hint');
    // algunos visores dan 0 al principio: se usa el tamaño del documento o uno por defecto y se vuelve a medir después
    const iw = window.innerWidth || document.documentElement.clientWidth || 800;
    const vh = window.innerHeight || document.documentElement.clientHeight || 450;
    const portrait = vh > iw * 1.15 && document.body.classList.contains('touch');
    document.body.classList.toggle('portrait', portrait);
    const ih = vh - (document.body.classList.contains('touch') ? 0 : (hint ? hint.offsetHeight + 12 : 0));
    let scale, vw;
    if (portrait) { vw = 320; scale = iw / 320; }
    else if (!(ih > 0)) { vw = 320; scale = 1; }             // en vertical: a todo lo ancho, aunque la escala no sea entera
    else {
      scale = Math.min(iw / 320, ih / 180);
      scale = scale >= 1 ? Math.floor(scale) : scale;        // píxel entero siempre que quepa
      vw = Math.max(320, Math.min(427, Math.floor(iw / scale)));   // en pantallas anchas se ve más escenario
    }
    rend.setView(vw);
    canvas.style.width = Math.round(vw * scale) + 'px'; canvas.style.height = Math.round(180 * scale) + 'px';
  }
  addEventListener('resize', fit); addEventListener('orientationchange', fit); fit(); [100, 300, 800, 1500].forEach(ms => setTimeout(fit, ms));
  if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(document.documentElement);
  canvas.addEventListener('pointerdown', () => { canvas.focus(); dir.tapped = true; });   // tocar el juego pasa el diálogo

  // ---------- teclado ----------
  const KEYS = {
    ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down',
    z: 'jump', Z: 'jump', ' ': 'jump', k: 'jump', K: 'jump',
    x: 'attack', X: 'attack', j: 'attack', J: 'attack',
    c: 'dash', C: 'dash', Shift: 'dash', l: 'dash', L: 'dash',
    v: 'sub', V: 'sub', i: 'sub', I: 'sub'

  addEventListener('keydown', e => {
    if (!dir.room.debug) { /* los atajos de prueba sólo en la sala de prueba */ }
    else if (e.key === '1') toggle('dash'); else if (e.key === '5') toggle('estocada'); else if (e.key === '2') toggle('wallJump'); else if (e.key === '3') toggle('pogo'); else if (e.key === '4') toggle('sub');

      src.pad.left = ax < -0.4 || b(14); src.pad.right = ax > 0.4 || b(15); src.pad.down = ay > 0.5 || b(13); src.pad.up = ay < -0.5 || b(12);
      src.pad.jump = b(0); src.pad.attack = b(2) || b(1); src.pad.dash = b(5) || b(7) || b(3); src.pad.sub = b(4) || b(6) || b(3);
    }
  }

  // ---------- táctil ----------
  if (isTouch) document.body.classList.add('touch');
  document.querySelectorAll('[data-act]').forEach(el => {
    const a = el.dataset.act, on = e => { e.preventDefault(); src.touch[a] = true; el.classList.add('on'); apply(); }, off = e => { e.preventDefault(); src.touch[a] = false; el.classList.remove('on'); apply(); };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
    el.addEventListener('contextmenu', e => e.preventDefault());

  const stick = document.getElementById('stick'), knob = document.getElementById('knob');

    const set = (dx, dy) => {

    stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
  }

  // ---------- banco de pruebas ----------
  function toggle(k) { const game = dir.game; game.abilities[k] = !game.abilities[k]; rend.say((k === 'wallJump' ? 'PARED' : k === 'pogo' ? 'REBOTE' : k === 'sub' ? 'ARMA' : k === 'estocada' ? 'ESTOCADA' : 'DASH') + (game.abilities[k] ? ' ACTIVADO' : ' BLOQUEADO'), 80); }
  function nextZone() { const game = dir.game; game.zone = (game.zone + 1) % ZONES.length; rend.say('ZONA ' + ZONES[game.zone].name, 80); }
  function restart() { const game = dir.game; game.checkpoint = { x: game.world.start.x, y: game.world.start.y }; game.cpIdx = -1; game.coins = 0; game.reset(false); game.won = false; }
  document.querySelectorAll('[data-dbg]').forEach(el => el.addEventListener('pointerdown', e => {
    e.preventDefault(); const k = el.dataset.dbg;
    if (k === 'zone') nextZone(); else if (k === 'reset') restart(); else toggle(k);

  }));

  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    pollPad(); apply();
    while (acc >= STEP) { dir.step(); acc -= STEP; }
    rend.draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
