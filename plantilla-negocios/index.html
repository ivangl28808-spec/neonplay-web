<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2937">
<title>Cargando…</title>
<meta name="description" content="">
<link rel="stylesheet" href="css/estilo.css">
<script src="js/pagina.js" defer></script>
</head>
<body>
<p class="aviso-ejemplo" id="avisoEjemplo" hidden>Página de ejemplo · negocio ficticio</p>

<header class="portada" id="inicio">
  <img class="portada-foto" id="portadaFoto" alt="" hidden>
  <div class="portada-texto">
    <p class="tipo" id="tipo"></p>
    <h1 id="nombre"></h1>
    <p class="lema" id="lema"></p>
    <p class="estado" id="estado" hidden></p>
    <div class="acciones">
      <a class="btn btn-wa" id="btnWhats" href="#" target="_blank" rel="noopener">Pedir por WhatsApp</a>
      <a class="btn btn-sec" id="btnLlamar" href="#" hidden>Llamar</a>
    </div>
  </div>
</header>

<nav class="menu-nav" aria-label="Secciones">
  <a href="#carta" id="navCarta">Menú</a>
  <a href="#horario">Horario</a>
  <a href="#ubicacion">Ubicación</a>
  <a href="#fotos" id="navFotos">Fotos</a>
</nav>

<main>
  <ul class="extras" id="extras" aria-label="Lo que ofrecemos"></ul>

  <section id="carta" aria-labelledby="tituloCarta">
    <h2 id="tituloCarta">Menú</h2>
    <div id="categorias"></div>
  </section>

  <section id="horario" aria-labelledby="tituloHorario">
    <h2 id="tituloHorario">Horario</h2>
    <table class="horario"><tbody id="tablaHorario"></tbody></table>
  </section>

  <section id="ubicacion" aria-labelledby="tituloUbicacion">
    <h2 id="tituloUbicacion">Ubicación</h2>
    <p class="direccion" id="direccion"></p>
    <p class="referencia" id="referencia" hidden></p>
    <a class="btn btn-sec" id="btnMapa" href="#" target="_blank" rel="noopener">Cómo llegar (Google Maps)</a>
  </section>

  <section id="fotos" aria-labelledby="tituloFotos">
    <h2 id="tituloFotos">Fotos</h2>
    <div class="galeria" id="galeria"></div>
  </section>
</main>

<footer class="pie">
  <p id="pieNombre"></p>
  <p class="pie-redes" id="redes"></p>
</footer>

<a class="wa-flotante" id="waFlotante" href="#" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp"></a>
<p class="toast" id="toast" role="status" hidden></p>
<p class="error" id="error" hidden></p>
</body>
</html>
